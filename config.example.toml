[defaults]
concurrency = 2
max_turns = 100
poll_interval = 30  # seconds between Linear polls (0 to disable)
web_port = 7890     # HTTP/WebSocket dashboard port
claude_plugins = ["superpowers@claude-plugins-official"]  # Claude Code plugins to install and load

[linear]
api_key = "lin_api_YOUR_KEY_HERE"

[projects.myproject]
repo_dir = "/Users/you/path-to-project"
base_branch = "main"
linear_team = "TEAM"
linear_assignee = "linearusername"
linear_label = "AI Automation"
github_command = "gh"
allowed_tools = "Read,Edit,Write,Glob,Grep,Bash(git *),Bash(composer *),Bash(php *),Bash(cd client *),Bash(pnpm *),Bash(proxychains4 *),Bash(gh *),Bash(cat *),Bash(ls *)"

